<p>如下图所示，未被对手棋子阻挡的两个棋子连成一排称为<strong>活二</strong>。首先，<strong>不做出活二就无法进攻</strong>。</p>
<board board=";B[hh];B[hi];B[fd];B[df];B[lj];B[lm];B[dk];B[el];B[kc];B[mc]"></board>

<p>在连珠中，<strong>同时做出多个活二</strong>，或者<strong>在做自己的活二的同时防守对手的活二</strong>，这样的下法通常是<strong>好棋</strong>。</p>
<p>例如，下图是<strong>同时做出三个活二的例子</strong>。请按箭头按钮查看。</p>
<board board="" moves=";B[hh];W[gi];B[gg];W[ii];B[fg];W[hg];B[fh]" cursor="6" show-kifu-button="true"></board>

<p>在下图中，<strong>连续三步棋，双方都在防守对方活二的同时建立自己的活二</strong>。请按箭头按钮查看。</p>
<p><strong>在减少对手一个活二的同时增加自己一个活二</strong>，以此来创造一个<strong>比对手拥有更多活二的局面</strong>。</p>
<board board="" moves=";B[hh];W[gi];B[jf];W[ii];B[ji];W[jh];B[hj]" cursor="4" show-kifu-button="true"></board>
