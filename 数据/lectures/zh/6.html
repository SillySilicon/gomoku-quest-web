<p>本章将说明在五子棋冒险中每个人都会遇到的难关——<strong>“桂马网”</strong>。第一次遇到时会感到<strong>绝望</strong>，所以请在这里<strong>掌握对策</strong>。</p>
<p>首先，请用箭头走一下下图的棋局。<br>

<p>如果只看白棋，就会如下图所示。这种布局被称为<strong>“桂马网”</strong>。很美吧。<br>
在桂马网内部，<strong>纵向和横向都只有4格的空间</strong>，因此<strong>绝对无法形成五连</strong>。就像刚才的黑棋一样，在桂马网里无论下多少三或四，都只会被<strong>白棋包围，处境越来越艰难</strong>。</p>
