<h2><strong>什么是连珠？</strong></h2>

<p>五子棋冒险的规则是<strong>连珠</strong>。</p>
<p>这是一种为了使<strong>先后手公平</strong>而完善的五子棋，游戏的目标是<strong>比对手先将五个棋子连成一线</strong>。</p>
<p><strong>第一手棋必须下在棋盘的中央</strong>，<strong>第二手棋必须下在中央的周围</strong>，<strong>第三手棋必须下在中央5x5的范围内</strong>。此后，可以下在任何位置。</p>
<p>下面是一个游戏示例，请按箭头感受一下过程。</p>
<p>当黑棋形成两边都未被阻挡的四个棋子排列（<strong>活四</strong>）时，游戏即告结束。活四<strong>可以确保在下一步棋中形成五连</strong>。</p>
