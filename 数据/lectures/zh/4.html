<p><strong>四</strong>是指再下一个子就能形成<strong>五连</strong>的形状。</p>
<p>和三一样，<strong>不应随意浪费四</strong>。但是，<strong>用连续的四来取胜</strong>被称为<strong>“追四”(VCF, Victory by Continuous Fours)</strong>。如果有追四(VCF)的机会，就<strong>无需防守对手的三，可以一举获胜</strong>。</p>
<p>在下图中，白棋形成了一个三，但黑棋可以不用防守，通过<strong>追四(VCF)</strong>来获胜。请按箭头按钮查看。</p>

<p><strong>追四(VCF)</strong>在连珠中是<strong>非常重要的技术</strong>。在五子棋冒险的“单人练习”中有“<strong>追四(VCF)练习题</strong>”和“<strong>追四(VCF)挑战</strong>”，请务必多加利用。</p>
