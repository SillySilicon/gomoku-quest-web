<h3><strong>关于禁手</strong></h3>
<p>在连珠中，为了<strong>防止先手（黑棋）过于有利</strong>，设有三种禁手（<strong>三三</strong>、<strong>四四</strong>、<strong>长连</strong>）。<strong>白棋没有禁手</strong>。</p>
<p><strong>三三</strong>：同时形成两个或以上活三的手法。</p>
<p>下图✖️的位置是<strong>三三</strong>，黑棋不能在此处落子。</p>
<board board=";B[cc];B[dd];B[fe];B[ge];B[hl];B[jl];B[kj];B[ki]" crosses="ee,kl"></board>
<p>三的严格定义将在后面说明，但下图因为<strong>被白棋阻挡</strong>，所以均不构成三三。</p>
<board board=";B[cc];B[dd];B[fe];B[ge];W[he];B[hl];B[jl];B[kj];B[ki];W[kh]" crosses="ee,kl"></board>

<p><strong>四四</strong>：同时形成两个或以上四的手法。</p>
<board board=";B[hh];B[ii];B[ed];B[fd];B[hd];B[de];B[df];B[dg];W[id];B[mg];W[dh];B[ki];B[lh];B[kk];W[nf]" crosses="dd,jj"></board>

<p><strong>长连</strong>：连成六个或以上棋子的手法。</p>
<board board=";B[ih];B[gh];B[jh];B[fh];B[kh]" crosses="hh"></board>
