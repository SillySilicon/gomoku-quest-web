<h2><strong>렌주란?</strong></h2>

<p>오목 퀘스트의 규칙은 <strong>렌주</strong>입니다.</p>
<p>오목을 <strong>선후 공평</strong>하게 만든 것으로, 게임의 목적은 <strong>상대보다 먼저 돌을 5개 나열하는 것</strong>입니다.</p>
<p><strong>첫 수는 바둑판 중앙</strong>, <strong>2수째는 그 주위 칸</strong>, <strong>3수째는 중앙 5x5 범위 내</strong>에 둡니다. 그 이후에는 어디에 두어도 상관없습니다.</p>
<p>아래에 게임 예시를 첨부하였으니, 화살표를 눌러 분위기를 파악해 보세요.</p>
<p>흑이 양쪽이 막히지 않은 4개의 돌 나열(<strong>열린 넷</strong>)을 만든 시점에서 게임은 종료됩니다. 열린 넷은 <strong>다음에 확실히 오목을 만들 수 있습니다</strong>.</p>
