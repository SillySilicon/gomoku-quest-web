<h3><strong>금수에 대하여</strong></h3>
<p>렌주에서는 <strong>선수(흑)가 너무 유리해지지 않도록</strong> 3가지 금수(<strong>삼삼</strong>, <strong>사사</strong>, <strong>장목</strong>)가 있습니다. <strong>백에게는 금수가 없습니다</strong>.</p>
<p><strong>삼삼</strong>: 2개 이상의 막히지 않은 삼을 동시에 만드는 수</p>
<p>아래 그림의 ✖️ 위치가 <strong>삼삼</strong>으로 흑은 돌을 놓을 수 없습니다.</p>
<board board=";B[cc];B[dd];B[fe];B[ge];B[hl];B[jl];B[kj];B[ki]" crosses="ee,kl"></board>
<p>삼의 엄밀한 정의는 나중에 설명하겠지만, 아래 그림은 <strong>백돌에 의해 막혀 있으므로</strong> 어느 것도 삼삼이 아닙니다.</p>
<board board=";B[cc];B[dd];B[fe];B[ge];W[he];B[hl];B[jl];B[kj];B[ki];W[kh]" crosses="ee,kl"></board>

<p><strong>사사</strong>: 2개 이상의 사를 동시에 만드는 수</p>
<board board=";B[hh];B[ii];B[ed];B[fd];B[hd];B[de];B[df];B[dg];W[id];B[mg];W[dh];B[ki];B[lh];B[kk];W[nf]" crosses="dd,jj"></board>
