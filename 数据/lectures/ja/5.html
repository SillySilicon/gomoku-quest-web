<p>下図のような、相手の石によって止まっていない2つの石の並びを<strong>連</strong>と言います。まずは<strong>連を作らないと攻めることは出来ません</strong>。</p>
<board board=";B[hh];B[hi];B[fd];B[df];B[lj];B[lm];B[dk];B[el];B[kc];B[mc]"></board>

<p>連珠では、<strong>連を複数同時に作る</strong>、<strong>連を作りながら相手の連を止める</strong>といった手が<strong>好手</strong>になることが多いです。</p>
<p>例えば、下図は<strong>連を3つ同時に作る例</strong>です。矢印ボタンを押してみてください。</p>
<board board="" moves=";B[hh];W[gi];B[gg];W[ii];B[fg];W[hg];B[fh]" cursor="6" show-kifu-button="true"></board>

<p>下図では、<strong>3手連続でお互いに相手の連を止めながら自分の連を作る手</strong>を打っています。矢印ボタンを押してみてください。</p>
<p><strong>相手の連を1つ減らしながら自分の連を1つ増やす</strong>、このようにして<strong>相手よりも連が多い状態</strong>を作ろうとしています。</p>
