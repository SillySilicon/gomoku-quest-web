<p><strong>四</strong>は、次に石を置くと<strong>五連</strong>になる形のことです。</p>
<p>四も三と同様、<strong>無闇に消費してしまってはいけません</strong>が、<strong>四の連続で勝つこと</strong>を<strong>四追い</strong>と言い、四追いがあれば<strong>相手の三を受ける必要もなく一気に勝ちに持っていけます</strong>。</p>
<p>下図は白に三が出来ていますが、三を止めずに黒は<strong>四追い</strong>で勝つことが出来ます。矢印ボタンを押してみてください。</p>
