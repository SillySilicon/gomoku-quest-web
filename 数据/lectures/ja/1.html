<h2><strong>連珠とは</strong></h2>

<p>五目クエストのルールは<strong>連珠（れんじゅ）</strong>です。</p>
<p>五目並べを<strong>先後互角</strong>になるように整備したもので、ゲームの目的は<strong>相手より先に石を5つ並べること</strong>。</p>
<p><strong>初手は盤面の中央</strong>、<strong>2手目はその周りのマス</strong>、<strong>3手目は中央5x5の範囲内</strong>に打ちます。それ以降はどこに打っても構いません。</p>
<p>以下にゲーム例を載せますので、矢印を押して雰囲気をつかんでください。</p>
<p>黒が両側の止まっていない4つの石の並び(<strong>棒四</strong>)を作ったところでゲームは終了しています。棒四は<strong>次に確実に五連にすることが出来ます</strong>。</p>
