<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>五子棋冒险</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(120% 80% at 20% 0%, rgba(30, 120, 190, 0.5), transparent 60%),
          linear-gradient(180deg, #0a2544 0%, #061428 60%, #020a14 100%);
        color: #e9f5ff;
        text-align: center;
      }
      .card {
        max-width: 420px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 10px;
        letter-spacing: 2px;
        text-shadow: 0 4px 18px rgba(55, 198, 255, 0.45);
      }
      p {
        margin: 0 0 24px;
        color: #8fb0c9;
        font-size: 14.5px;
        line-height: 1.7;
      }
      a.btn {
        display: inline-block;
        padding: 14px 32px;
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(32, 150, 215, 0.98), rgba(12, 90, 145, 0.98));
        border: 1px solid rgba(90, 210, 255, 0.5);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        box-shadow: 0 10px 26px rgba(0, 60, 100, 0.5);
      }
      a.btn:active {
        transform: scale(0.98);
      }
      p.alt {
        margin: 18px 0 0;
        font-size: 13.5px;
      }
      p.alt a {
        color: #7fb6d9;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .tip {
        margin-top: 22px;
        font-size: 12.5px;
        color: #5f7f99;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>五子棋冒险</h1>
      <p>连珠对弈 · 4200 道 VCF 挑战题 · 7 节连珠课程 · 四语言</p>
      <a class="btn" href="./web/index.html">进入应用</a>
      <p class="tip">
        在 iPhone 上用 Safari 打开后，点「分享 → 添加到主屏幕」，即可全屏离线使用。
      </p>
      <p class="alt">
        <a href="./download/gomoku-quest-offline.zip">下载离线版（zip，含单文件 HTML + 使用说明）</a>
      </p>
      <p class="tip">
        想离线保存在手机上：iPhone 推荐「添加到主屏幕」；也可以用带浏览器的文件管理器打开 zip 里的 HTML。
      </p>
    </div>
    <script>
      if (!/preview|nojs/.test(location.search)) {
        location.replace("./web/index.html");
      }
    </script>
  </body>
</html>
